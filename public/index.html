<style>
  :root {
    --bg: #F3F6F2;
    --surface: #FFFFFF;
    --surface-2: #EAF0EA;
    --text: #1A2420;
    --text-muted: #5B6B62;
    --border: #DBE4DB;
    --accent: #2E6F63;
    --accent-strong: #1E5148;
    --accent-soft: #E0EFEA;
    --warn: #B5702F;
    --warn-soft: #F6E7D6;
    --shadow: rgba(24, 33, 28, 0.08);
    --done-strike: #93A69C;
    --surface-tint: color-mix(in srgb, var(--accent) 7%, var(--surface));
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101512;
      --surface: #182019;
      --surface-2: #1E2820;
      --text: #E8ECE7;
      --text-muted: #98A99F;
      --border: #2A352C;
      --accent: #63C2A9;
      --accent-strong: #86D6C0;
      --accent-soft: #1E3830;
      --warn: #E3A768;
      --warn-soft: #3A2A18;
      --shadow: rgba(0, 0, 0, 0.45);
      --done-strike: #607064;
    }
  }

  :root[data-theme="dark"] {
    --bg: #101512;
    --surface: #182019;
    --surface-2: #1E2820;
    --text: #E8ECE7;
    --text-muted: #98A99F;
    --border: #2A352C;
    --accent: #63C2A9;
    --accent-strong: #86D6C0;
    --accent-soft: #1E3830;
    --warn: #E3A768;
    --warn-soft: #3A2A18;
    --shadow: rgba(0, 0, 0, 0.45);
    --done-strike: #607064;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Manrope", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  header.page-head {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 6px;
  }

  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
  }

  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: clamp(2rem, 5vw, 2.7rem);
    margin: 0;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .tagline {
    color: var(--text-muted);
    font-size: 0.95rem;
    max-width: 46ch;
    margin: 8px 0 0;
  }

  .reset-block {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
    text-align: right;
  }

  #resetBtn {
    font-family: "Manrope", sans-serif;
    font-weight: 700;
    font-size: 0.88rem;
    background: var(--accent);
    color: var(--surface);
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 2px 8px var(--shadow);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  #resetBtn:hover { background: var(--accent-strong); transform: translateY(-1px); }
  #resetBtn:active { transform: translateY(0); }
  #resetBtn.confirm-armed { background: var(--warn); }
  #resetBtn:disabled { opacity: 0.6; cursor: default; transform: none; }

  .last-reset {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.74rem;
    color: var(--text-muted);
  }
  .last-reset span { color: var(--text); font-weight: 500; }

  .color-picker {
    margin-top: 18px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .color-picker-label {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .swatches { display: flex; gap: 9px; }
  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    padding: 0;
    cursor: pointer;
    background: var(--swatch-bg);
    box-shadow: 0 0 0 1px var(--border);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.selected {
    box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--swatch-bg);
  }

  .overall-progress {
    margin-top: 22px;
    background: var(--surface-tint);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    box-shadow: 0 1px 3px var(--shadow);
  }
  .overall-progress .track {
    flex: 1;
    height: 10px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
  }
  .overall-progress .fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    width: 0%;
    transition: width 0.35s ease;
  }
  .overall-progress .count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.88rem;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .overall-progress .count b { color: var(--text); font-weight: 600; }

  .roommates {
    margin-top: 22px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .roommate-chip {
    background: var(--surface-tint);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.82rem;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .roommate-chip .room {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-muted);
  }
  .roommate-chip .names { font-weight: 600; }

  .areas {
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }
  @media (max-width: 620px) {
    .areas { grid-template-columns: 1fr; }
    header.page-head { flex-direction: column; align-items: flex-start; }
    .reset-block { align-items: flex-start; text-align: left; }
  }

  .area-card {
    background: var(--surface-tint);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 20px 16px;
    box-shadow: 0 1px 3px var(--shadow);
  }

  .area-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 4px;
  }

  .area-head h2 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 1.28rem;
    margin: 0;
  }

  .area-frac {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    color: var(--text-muted);
    white-space: nowrap;
    padding-top: 3px;
  }

  .area-sub {
    margin: -2px 0 12px;
    font-size: 0.8rem;
    color: var(--text-muted);
  }

  .area-card.wide { grid-column: 1 / -1; }

  .bedrooms { margin-top: 34px; }

  .room-standard-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .room-standard-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 6px;
    font-size: 0.92rem;
  }

  .room-standard-list li::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    flex-shrink: 0;
  }

  .assignee {
    flex-shrink: 0;
    margin-left: auto;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.7rem;
    font-weight: 500;
    color: var(--accent-strong);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 2px 9px;
    white-space: nowrap;
  }

  ul.tasks {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  ul.tasks li {
    border-radius: 8px;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  ul.tasks label {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 6px;
    cursor: pointer;
    border-radius: 8px;
    font-size: 0.92rem;
    flex: 1 1 auto;
    min-width: 0;
  }
  ul.tasks label:hover { background: var(--surface-2); }
  ul.tasks li .assignee { margin-top: 9px; }

  ul.tasks input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 19px;
    height: 19px;
    flex-shrink: 0;
    margin-top: 1px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    cursor: pointer;
    position: relative;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  ul.tasks input[type="checkbox"]:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  ul.tasks input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 6px;
    height: 11px;
    border: solid var(--surface);
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }

  ul.tasks .task-text { padding-top: 1px; }

  ul.tasks input[type="checkbox"]:checked ~ .task-text {
    color: var(--done-strike);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
  }

  .status-banner {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    font-size: 0.82rem;
    padding: 10px 18px;
    border-radius: 999px;
    box-shadow: 0 4px 16px var(--shadow);
    z-index: 100;
  }

  footer.note {
    margin-top: 30px;
    color: var(--text-muted);
    font-size: 0.8rem;
    text-align: center;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 14px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.76rem;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    text-decoration: none;
  }
  .back-link:hover { color: var(--accent); }

  .community-section {
    margin-top: 30px;
  }
  .community-section + .community-section {
    margin-top: 36px;
  }

  .community-title {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.76rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .apartment-grid {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 16px;
  }

  .apartment-card {
    display: block;
    background: var(--surface-tint);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px 22px;
    text-decoration: none;
    color: var(--text);
    box-shadow: 0 1px 3px var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .apartment-card:hover { transform: translateY(-2px); box-shadow: 0 4px 14px var(--shadow); }
  .apartment-card h2 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 1.2rem;
    margin: 0 0 6px;
  }
  .apartment-card p {
    margin: 0;
    font-size: 0.82rem;
    color: var(--text-muted);
  }

  .not-found {
    margin-top: 40px;
    padding: 30px 0;
    text-align: center;
  }
  .not-found p { color: var(--text-muted); }
</style>

  var ACCENT_COLORS = [
    { key: "teal",   label: "Teal (default)", light: ["#2E6F63", "#1E5148", "#E0EFEA"], dark: ["#63C2A9", "#86D6C0", "#1E3830"] },
    { key: "blue",   label: "Blue",           light: ["#2A5FA8", "#1D4275", "#E3ECF9"], dark: ["#6FA8E8", "#9CC4F0", "#16283F"] },
    { key: "purple", label: "Purple",         light: ["#6A4C93", "#4E3670", "#EDE6F5"], dark: ["#B08CE0", "#C7A9EE", "#2C2140"] },
    { key: "coral",  label: "Coral",          light: ["#B5502F", "#8A3B21", "#F7E2D6"], dark: ["#E8916A", "#F0AC8C", "#3A2418"] },
    { key: "rose",   label: "Rose",           light: ["#A8406A", "#7C2C4E", "#F7E1EB"], dark: ["#E88CB0", "#F0AACA", "#3A1E29"] },
    { key: "slate",  label: "Slate",          light: ["#45607A", "#324658", "#E6ECF1"], dark: ["#8CA8C0", "#AFC6D8", "#212C36"] }
  ];
  var ACCENT_STORAGE_KEY = "roomcheck-accent-color";

  function isDarkMode() {
    return !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  }

  function applyAccent(colorKey) {
    var color = null;
    for (var i = 0; i < ACCENT_COLORS.length; i++) {
      if (ACCENT_COLORS[i].key === colorKey) { color = ACCENT_COLORS[i]; break; }
    }
    if (!color) color = ACCENT_COLORS[0];
    var vals = isDarkMode() ? color.dark : color.light;
    var root = document.documentElement.style;
    root.setProperty("--accent", vals[0]);
    root.setProperty("--accent-strong", vals[1]);
    root.setProperty("--accent-soft", vals[2]);
    document.querySelectorAll(".swatch").forEach(function (btn) {
      btn.classList.toggle("selected", btn.getAttribute("data-color") === color.key);
    });
  }

  function getSavedAccent() {
    try { return localStorage.getItem(ACCENT_STORAGE_KEY); } catch (e) { return null; }
  }

  function initColorPicker() {
    var wrap = document.getElementById("swatches");
    if (!wrap) return;
    wrap.innerHTML = "";
    ACCENT_COLORS.forEach(function (color) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "swatch";
      btn.setAttribute("data-color", color.key);
      btn.style.setProperty("--swatch-bg", color.light[0]);
      btn.title = color.label;
      btn.setAttribute("aria-label", color.label);
      btn.addEventListener("click", function () {
        try { localStorage.setItem(ACCENT_STORAGE_KEY, color.key); } catch (e) {}
        applyAccent(color.key);
      });
      wrap.appendChild(btn);
    });
    applyAccent(getSavedAccent() || "teal");
    if (window.matchMedia) {
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () {
        applyAccent(getSavedAccent() || "teal");
      });
    }
  }

  var COLOR_PICKER_HTML =
    '<div class="color-picker" role="group" aria-label="Accent color">' +
      '<span class="color-picker-label">Color</span>' +
      '<div class="swatches" id="swatches"></div>' +
    '</div>';

  // ---------------------------------------------------------------------
  // Routing: a plain path like "/1953-101" maps to an apartment slug.
  // Everything is a normal page load (no client-side nav), so we just
  // decide once, at load time, what to render.
  // ---------------------------------------------------------------------
  function getSlug() {
    var path = window.location.pathname.replace(/^\/+|\/+$/g, "");
    if (path === "" || path.toLowerCase() === "index.html") return null;
    return decodeURIComponent(path).toLowerCase();
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function renderHome() {
    document.title = "Roomcheck";
    var slugs = Object.keys(APARTMENTS);

    // Group apartments by their "community" field, preserving the order
    // each community is first encountered in APARTMENTS. Apartments with
    // no community set land in a catch-all "Other" section.
    var groups = [];
    var groupIndex = {};
    slugs.forEach(function (slug) {
      var a = APARTMENTS[slug];
      var community = a.community || "Other";
      if (!(community in groupIndex)) {
        groupIndex[community] = groups.length;
        groups.push({ name: community, slugs: [] });
      }
      groups[groupIndex[community]].slugs.push(slug);
    });

    var sectionsHtml = groups.map(function (group) {
      var cards = group.slugs.map(function (slug) {
        var a = APARTMENTS[slug];
        return '<a class="apartment-card" href="/' + encodeURIComponent(slug) + '">' +
          "<h2>" + escapeHtml(a.name) + "</h2>" +
          "<p>" + a.people.length + " roommates</p>" +
        "</a>";
      }).join("");
      return '<section class="community-section">' +
        '<h2 class="community-title">' + escapeHtml(group.name) + "</h2>" +
        '<div class="apartment-grid">' + cards + "</div>" +
      "</section>";
    }).join("");

    document.getElementById("wrap").innerHTML =
      '<header class="page-head">' +
        "<div>" +
          '<p class="eyebrow">Weekly Roomcheck</p>' +
          "<h1>Choose your apartment</h1>" +
          '<p class="tagline">Pick your apartment to see this week\u2019s shared checklist.</p>' +
        "</div>" +
      "</header>" +
      COLOR_PICKER_HTML +
      sectionsHtml +
      '<footer class="note">Don\u2019t see your apartment here? Ask whoever manages this site to add it.</footer>';

    initColorPicker();
  }

  function renderNotFound(slug) {
    document.title = "Roomcheck \u2014 Not found";
    document.getElementById("wrap").innerHTML =
      '<a class="back-link" href="/">&larr; All apartments</a>' +
      '<div class="not-found">' +
        "<h1>Apartment not found</h1>" +
        "<p>There\u2019s no apartment set up at \u201c" + escapeHtml(slug) + "\u201d yet.</p>" +
      "</div>";
  }

  function renderApp(slug, config) {
    document.title = "Roomcheck \u2014 " + config.name;

    var roommatesHtml = config.roommates.map(function (r) {
      return '<div class="roommate-chip"><span class="room">' + escapeHtml(r.room) + '</span><span class="names">' + escapeHtml(r.names) + "</span></div>";
    }).join("");

    var areasHtml = config.areas.map(function (area) {
      var tasksHtml = area.tasks.map(function (text, i) {
        return '<li><label><input type="checkbox" data-key="' + area.id + "-" + i + '"><span class="task-text">' + escapeHtml(text) + '</span></label><span class="assignee" data-assignee>&nbsp;</span></li>';
      }).join("");
      return '<div class="area-card' + (area.wide ? " wide" : "") + '" data-area="' + area.id + '">' +
        '<div class="area-head">' +
          "<h2>" + escapeHtml(area.title) + "</h2>" +
          '<span class="area-frac" data-frac>0/' + area.tasks.length + "</span>" +
        "</div>" +
        '<p class="area-sub">' + escapeHtml(area.sub) + "</p>" +
        '<ul class="tasks">' + tasksHtml + "</ul>" +
      "</div>";
    }).join("");

    var bedroomsHtml = config.bedroomStandard.map(function (item) {
      return "<li>" + escapeHtml(item) + "</li>";
    }).join("");

    document.getElementById("wrap").innerHTML =
      '<a class="back-link" href="/">&larr; All apartments</a>' +
      '<header class="page-head">' +
        "<div>" +
          '<p class="eyebrow">Weekly Roomcheck</p>' +
          "<h1>" + escapeHtml(config.name) + "</h1>" +
          '<p class="tagline">' + escapeHtml(config.tagline) + "</p>" +
        "</div>" +
        '<div class="reset-block">' +
          '<button id="resetBtn" type="button">Start new week</button>' +
          '<p class="last-reset">Week started <span id="lastReset">this week</span></p>' +
        "</div>" +
      "</header>" +
      COLOR_PICKER_HTML +
      '<div class="overall-progress">' +
        '<div class="track"><div class="fill" id="overallFill"></div></div>' +
        '<div class="count" id="overallCount">0 / 0 done</div>' +
      "</div>" +
      '<div class="roommates">' + roommatesHtml + "</div>" +
      '<div class="areas">' + areasHtml + "</div>" +
      '<div class="bedrooms"><div class="area-card"><div class="area-head"><h2>Bedrooms</h2></div>' +
        '<p class="area-sub">This is the standard for your own room, every week, no matter which bedroom you\u2019re in.</p>' +
        '<ul class="room-standard-list">' + bedroomsHtml + "</ul>" +
      "</div></div>" +
      '<footer class="note">This page saves everyone\u2019s check\u2011offs automatically \u2014 no need to re\u2011send it each week, just tap \u201cStart new week\u201d after each roomcheck. Every job\u2019s assigned person rotates down one spot when you do.</footer>';

    initColorPicker();
    initApp(slug, config);
  }

  // ---------------------------------------------------------------------
  // Checklist behavior: sync, rotation, reset. Scoped to one apartment's
  // config each time it runs (once per page load, only on an app view).
  // ---------------------------------------------------------------------
  function initApp(slug, config) {
    var ALL_PEOPLE = config.people;
    var AREAS = config.areas.map(function (area) {
      return {
        id: area.id,
        rotationPeople: area.rotationPeople === "all" ? ALL_PEOPLE : area.rotationPeople
      };
    });
    var ALL_KEYS = [];
    config.areas.forEach(function (area) {
      area.tasks.forEach(function (t, i) { ALL_KEYS.push(area.id + "-" + i); });
    });

    var API = "/api/state?apartment=" + encodeURIComponent(slug);
    var POLL_MS = 4000;

    var state = { checked: {}, rotationOffset: 0, lastReset: null, updatedAt: null };
    var saveTimer = null;
    var saving = false;
    var loaded = false;
    var pollTimer = null;

    function renderBathRotation(areaId, people, offset) {
      var card = document.querySelector('.area-card[data-area="' + areaId + '"]');
      if (!card) return;
      var slots = card.querySelectorAll("[data-assignee]");
      slots.forEach(function (el, i) {
        el.textContent = people[(offset + i) % people.length];
      });
    }

    function renderAssignments() {
      var offset = state.rotationOffset || 0;
      AREAS.forEach(function (area) {
        renderBathRotation(area.id, area.rotationPeople, offset);
      });
    }

    function renderProgress() {
      var totalDone = 0, totalAll = 0;
      document.querySelectorAll(".area-card").forEach(function (card) {
        var boxes = card.querySelectorAll('input[type="checkbox"]');
        var done = 0;
        boxes.forEach(function (b) { if (b.checked) done++; });
        totalDone += done;
        totalAll += boxes.length;
        var frac = card.querySelector("[data-frac]");
        if (frac) frac.textContent = done + "/" + boxes.length;
      });
      var fill = document.getElementById("overallFill");
      var count = document.getElementById("overallCount");
      var pct = totalAll ? Math.round((totalDone / totalAll) * 100) : 0;
      if (fill) fill.style.width = pct + "%";
      if (count) count.innerHTML = "<b>" + totalDone + " / " + totalAll + "</b> done";
    }

    function renderAll() {
      renderAssignments();
      renderProgress();
    }

    function applyStateToDom() {
      document.querySelectorAll("input[type=\"checkbox\"][data-key]").forEach(function (cb) {
        cb.checked = !!state.checked[cb.getAttribute("data-key")];
      });
      var lr = document.getElementById("lastReset");
      if (lr) lr.textContent = state.lastReset || "this week";
    }

    function showBanner(id, text) {
      if (document.getElementById(id)) return;
      var note = document.createElement("div");
      note.id = id;
      note.className = "status-banner";
      note.textContent = text;
      document.body.appendChild(note);
    }

    function hideBanner(id) {
      var el = document.getElementById(id);
      if (el) el.remove();
    }

    function fetchState() {
      return fetch(API, { cache: "no-store" }).then(function (res) {
        if (!res.ok) throw new Error("state fetch failed: " + res.status);
        return res.json();
      });
    }

    function applyServerState(data) {
      state = data;
      applyStateToDom();
      renderAll();
      hideBanner("offlineNote");
    }

    function loadInitial() {
      fetchState()
        .then(function (data) {
          applyServerState(data);
          loaded = true;
          startPolling();
        })
        .catch(function (err) {
          console.warn("[roomcheck] initial load failed", err);
          loaded = true;
          renderAll();
          showBanner("offlineNote", "Couldn't reach the server \u2014 check-offs won't be shared right now.");
          startPolling();
        });
    }

    function startPolling() {
      clearInterval(pollTimer);
      pollTimer = setInterval(function () {
        if (saving || saveTimer) return; // don't clobber an in-flight local edit
        fetchState()
          .then(function (data) {
            if (JSON.stringify(data) !== JSON.stringify(state)) applyServerState(data);
            hideBanner("offlineNote");
          })
          .catch(function () {
            showBanner("offlineNote", "Couldn't reach the server \u2014 check-offs won't be shared right now.");
          });
      }, POLL_MS);
    }

    var pendingPatch = {};

    function scheduleCheckboxSave(patch) {
      Object.assign(pendingPatch, patch);
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () {
        var toSend = pendingPatch;
        pendingPatch = {};
        doSave({ checkedPatch: toSend });
      }, 700);
    }

    function doSave(body) {
      saveTimer = null;
      saving = true;
      fetch(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      })
        .then(function (res) {
          if (!res.ok) throw new Error("save failed: " + res.status);
          return res.json();
        })
        .then(function (data) {
          state = data;
          saving = false;
          hideBanner("offlineNote");
        })
        .catch(function (err) {
          console.warn("[roomcheck] save failed", err);
          saving = false;
          showBanner("offlineNote", "Couldn't save that \u2014 check your connection. Retrying...");
          setTimeout(function () { doSave(body); }, 2000);
        });
    }

    document.addEventListener("change", function (e) {
      var t = e.target;
      if (t && t.matches('input[type="checkbox"][data-key]')) {
        if (!loaded) return;
        var key = t.getAttribute("data-key");
        state.checked[key] = t.checked;
        renderProgress();
        var patch = {};
        patch[key] = t.checked;
        scheduleCheckboxSave(patch);
      }
    });

    var resetBtn = document.getElementById("resetBtn");
    var confirmTimer = null;

    function armReset() {
      resetBtn.textContent = "Tap again to confirm";
      resetBtn.classList.add("confirm-armed");
      clearTimeout(confirmTimer);
      confirmTimer = setTimeout(disarmReset, 3000);
    }

    function disarmReset() {
      clearTimeout(confirmTimer);
      resetBtn.textContent = "Start new week";
      resetBtn.classList.remove("confirm-armed");
    }

    function doReset() {
      var clearPatch = {};
      ALL_KEYS.forEach(function (k) { clearPatch[k] = false; state.checked[k] = false; });
      var newOffset = (state.rotationOffset || 0) + 1;
      var today = new Date();
      var label = today.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      state.rotationOffset = newOffset;
      state.lastReset = label;
      applyStateToDom();
      renderAll();
      clearTimeout(saveTimer);
      saveTimer = null;
      pendingPatch = {};
      doSave({ checkedPatch: clearPatch, rotationOffset: newOffset, lastReset: label });
    }

    if (resetBtn) {
      resetBtn.addEventListener("click", function () {
        if (resetBtn.classList.contains("confirm-armed")) {
          disarmReset();
          doReset();
        } else {
          armReset();
        }
      });
    }

    loadInitial();
  }

  // ---------------------------------------------------------------------
  // Entry point
  // ---------------------------------------------------------------------
  var slug = getSlug();
  if (slug === null) {
    renderHome();
  } else if (APARTMENTS[slug]) {
    renderApp(slug, APARTMENTS[slug]);
  } else {
    renderNotFound(slug);
  }
})();
</script>
</body>
</html>
